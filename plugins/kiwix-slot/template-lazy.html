<div class="wiki-card kiwix--wiki-card" data-kiwix-lazy data-article-url="{{url}}"
    data-details-route="{{detailsRoute}}">
    <div class="wiki-overview">
        <a class="wiki-title" href="{{url}}" target="_blank" rel="noopener noreferrer">{{title}}</a>
        <div class="skeleton-media-thumb">Loading details...</div>
    </div>
    <div class="wiki-body">
        <a class="wiki-footer-link" href="{{url}}" target="_blank" rel="noopener noreferrer">Kiwix ↗</a>
    </div>
</div>
