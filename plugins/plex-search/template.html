<div class="result-item">
  <div class="result-item-inner">
    {{thumbnailBlock}}
    <div class="result-body">
      <div class="result-url-row">
        <img class="result-favicon" src="{{favicon_url}}" alt="" width="26" height="26" loading="lazy" />
        <cite class="result-cite">{{cite_url}}</cite>
      </div>
      <a class="result-title" href="{{url}}">{{title}}</a>
      {{subtitleBlock}}
      <p class="result-snippet">{{overview}}</p>
      <div class="result-engines">{{badgesBlock}}</div>
    </div>
  </div>
</div>
